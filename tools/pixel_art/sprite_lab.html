<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Pixel Sprite Lab</title>
<style>
  html, body { margin: 0; background: #0c0b14; color: #a9b2bc; font: 12px monospace; }
  canvas { image-rendering: pixelated; display: block; }
  #wrap { padding: 8px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script type="module">
import { getEnemySprite } from '../../src/pixel/enemy_sprites.js';
import { drawPixelText } from '../../src/pixel/pixel_font.js';
import { RAMPS } from '../../src/pixel/palette.js';

const params = new URLSearchParams(location.search);
const SCALE = Number(params.get('scale') || 3);
const CELL = Number(params.get('cell') || 38);
const list = [
  ['residue', 1, 1], ['residue', 1, 1, true], ['eliteGolem', 1, 1], ['bastion', 3, 1], ['deflector', 2, 1],
  ['maw', 2, 2], ['echoSpire', 1, 2], ['prism', 1, 3], ['hive', 2, 3], ['carrier', 3, 2], ['siege', 3, 2], ['gravityWell', 3, 3],
];
const W = 300, H = 470;
const c = document.getElementById('c');
c.width = W; c.height = H;
c.style.width = (W * SCALE) + 'px';
c.style.height = (H * SCALE) + 'px';
const g = c.getContext('2d');
g.imageSmoothingEnabled = false;
// 地面
for (let y = 0; y < H; y += 1) for (let x = 0; x < W; x += 1) {
  g.fillStyle = ((x >> 4) + (y >> 4)) % 2 ? RAMPS.slate[1] : RAMPS.slate[0];
  g.fillRect(x, y, 1, 1);
}
let x = 4, y = 4, rowH = 0;
for (const [arch, cols, rows, elite] of list) {
  const w = cols * CELL - 2, h = rows * CELL - 2;
  if (x + w > W - 4) { x = 4; y += rowH + 14; rowH = 0; }
  const s = getEnemySprite({ archetype: arch, w, h, elite: !!elite, seed: x + y });
  g.drawImage(s, x, y);
  drawPixelText(g, String(Math.round(5 + (x * 7 + y) % 40)), x + w / 2, y + h / 2 - 4, { align: 'center', color: '#f0f3f5' });
  drawPixelText(g, arch.slice(0, 6), x, y + h + 2, { font: '3x5', color: '#828d9a', outline: null });
  x += w + 6; rowH = Math.max(rowH, h);
}
window.__ready = true;
</script>
</body>
</html>

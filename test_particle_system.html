<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParticleSystem3D 测试</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #0a0a0a;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            line-height: 1.6;
        }
        #info h3 {
            margin: 0 0 10px 0;
            color: #4ade80;
        }
        #stats {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #333;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        .stat-label {
            color: #aaa;
        }
        .stat-value {
            color: #4ade80;
            font-weight: bold;
        }
        button {
            background: #4ade80;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px 5px 5px 0;
        }
        button:hover {
            background: #22c55e;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>🎨 ParticleSystem3D 测试</h3>
        <div>
            <button onclick="addParticles('spark', 100)">添加 Spark (100)</button>
            <button onclick="addParticles('ember', 100)">添加 Ember (100)</button>
            <button onclick="addParticles('mist', 50)">添加 Mist (50)</button>
            <button onclick="addParticles('shard', 100)">添加 Shard (100)</button>
            <button onclick="addParticles('wind_slash', 50)">添加 Wind Slash (50)</button>
        </div>
        <div>
            <button onclick="stressTest()">压力测试 (5000粒子)</button>
            <button onclick="clearParticles()">清空粒子</button>
        </div>
        <div id="stats">
            <div class="stat-item">
                <span class="stat-label">活跃粒子数:</span>
                <span class="stat-value" id="particleCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">FPS:</span>
                <span class="stat-value" id="fps">60</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">渲染时间:</span>
                <span class="stat-value" id="renderTime">0ms</span>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
        import { ParticleSystem3D } from './src/render3d/entities/particle.js';

        // 简化的 Vec2 类
        class Vec2 {
            constructor(x, y) { this.x = x; this.y = y; }
            add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
            mult(s) { return new Vec2(this.x * s, this.y * s); }
        }

        // 简化的 Particle 类 (模拟 entities.js 中的实现)
        class Particle {
            constructor(x, y, color, mode = 'normal') {
                this.pos = new Vec2(x, y);
                this.color = color;
                this.mode = mode;
                this.life = 1.0;
                this.maxLife = 1.0;
                
                const angle = Math.random() * Math.PI * 2;
                
                if (mode === 'spark') {
                    const speed = Math.random() * 5 + 2;
                    this.vel = new Vec2(Math.cos(angle) * speed, Math.sin(angle) * speed);
                    this.drag = 0.85;
                    this.gravity = 0.1;
                    this.decay = 0.05 + Math.random() * 0.05;
                    this.size = Math.random() * 2 + 1;
                } else if (mode === 'ember') {
                    this.vel = new Vec2((Math.random() - 0.5) * 1.0, -Math.random() * 2.0 - 0.5);
                    this.drag = 0.98;
                    this.gravity = -0.08;
                    this.decay = 0.015 + Math.random() * 0.02;
                    this.size = Math.random() * 1.5 + 0.5;
                } else if (mode === 'mist') {
                    this.vel = new Vec2((Math.random() - 0.5) * 0.8, Math.random() * 0.5 + 0.5);
                    this.drag = 0.96;
                    this.gravity = 0.02;
                    this.decay = 0.015 + Math.random() * 0.01;
                    this.size = Math.random() * 8 + 6;
                    this.angle = Math.random() * Math.PI * 2;
                } else if (mode === 'shard') {
                    const speed = Math.random() * 4 + 2;
                    this.vel = new Vec2(Math.cos(angle) * speed, Math.sin(angle) * speed);
                    this.drag = 0.96;
                    this.gravity = 0.4;
                    this.decay = 0.02 + Math.random() * 0.02;
                    this.size = Math.random() * 4 + 2;
                    this.angle = Math.random() * Math.PI * 2;
                    this.spin = (Math.random() - 0.5) * 0.5;
                } else if (mode === 'wind_slash') {
                    const speed = Math.random() * 8 + 4;
                    this.vel = new Vec2(Math.cos(angle) * speed, Math.sin(angle) * speed);
                    this.drag = 1.0;
                    this.gravity = 0;
                    this.decay = 0.05;
                    this.size = 10;
                    this.life = 1.0;
                    this.angle = 0;
                } else {
                    this.vel = new Vec2((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4);
                    this.drag = 0.92;
                    this.gravity = 0;
                    this.decay = 0.05;
                    this.size = Math.random() * 2 + 1;
                }
                
                this.maxLife = this.life;
            }

            update(timeScale = 1.0) {
                this.pos = this.pos.add(this.vel.mult(timeScale));
                this.vel = this.vel.mult(Math.pow(this.drag, timeScale));
                this.vel.y += this.gravity * timeScale;
                
                if (this.mode === 'shard' || this.mode === 'mist') {
                    this.angle = (this.angle || 0) + (this.spin || 0) * timeScale;
                }
                
                this.life -= this.decay * timeScale;
            }
        }

        // 初始化场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        // 初始化摄像机
        const camera = new THREE.OrthographicCamera(
            window.innerWidth / -2, window.innerWidth / 2,
            window.innerHeight / 2, window.innerHeight / -2,
            0.1, 1000
        );
        camera.position.z = 10;

        // 初始化渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 初始化粒子系统
        const particleSystem = new ParticleSystem3D(scene, 10000);

        // 粒子数组
        const particles = [];

        // 添加粒子的函数
        window.addParticles = function(mode, count) {
            const colors = {
                'spark': '#ffaa00',
                'ember': '#ff6600',
                'mist': '#00ffff',
                'shard': '#00ccff',
                'wind_slash': '#00ff88'
            };
            
            const color = colors[mode] || '#ffffff';
            
            for (let i = 0; i < count; i++) {
                const x = (Math.random() - 0.5) * 400;
                const y = (Math.random() - 0.5) * 400;
                particles.push(new Particle(x, y, color, mode));
            }
        };

        // 压力测试
        window.stressTest = function() {
            const modes = ['spark', 'ember', 'mist', 'shard', 'wind_slash'];
            for (let i = 0; i < 5000; i++) {
                const mode = modes[Math.floor(Math.random() * modes.length)];
                window.addParticles(mode, 1);
            }
        };

        // 清空粒子
        window.clearParticles = function() {
            particles.length = 0;
        };

        // FPS 计算
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 60;

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const deltaTime = (now - lastTime) / 1000;
            lastTime = now;

            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(1.0);
                
                // 移除死亡粒子
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // 同步粒子到 GPU
            const startSync = performance.now();
            particleSystem.syncParticles(particles);
            const syncTime = performance.now() - startSync;

            // 渲染场景
            const startRender = performance.now();
            renderer.render(scene, camera);
            const renderTime = performance.now() - startRender;

            // 更新统计信息
            frameCount++;
            if (now - lastTime > 100) {
                fps = Math.round(frameCount / deltaTime);
                frameCount = 0;
            }

            document.getElementById('particleCount').textContent = particles.length;
            document.getElementById('fps').textContent = fps;
            document.getElementById('renderTime').textContent = 
                (syncTime + renderTime).toFixed(2) + 'ms';
        }

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.left = window.innerWidth / -2;
            camera.right = window.innerWidth / 2;
            camera.top = window.innerHeight / 2;
            camera.bottom = window.innerHeight / -2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 启动动画
        animate();

        // 初始添加一些粒子
        window.addParticles('spark', 50);
        window.addParticles('ember', 50);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CameraController 测试 - Echo Alchemist</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #0a0a0a;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            color: white;
            min-width: 300px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            background: #00ff88;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #00cc66;
            transform: scale(1.02);
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .info {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            font-size: 12px;
        }
        
        h2 {
            margin-top: 0;
            color: #00ff88;
        }
        
        .current-preset {
            color: #00ff88;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h2>📹 摄像机控制器测试</h2>
        
        <div class="info">
            <strong>当前预设:</strong> <span id="current-preset" class="current-preset">-</span>
        </div>
        
        <div class="info">
            <strong>摄像机位置:</strong><br>
            X: <span id="pos-x">-</span><br>
            Y: <span id="pos-y">-</span><br>
            Z: <span id="pos-z">-</span>
        </div>
        
        <div class="info">
            <strong>FOV:</strong> <span id="fov">-</span>°
        </div>
        
        <button onclick="setTopDownView()">🔽 2D俯视视角</button>
        <button onclick="setIsometricView()">📐 3D斜视视角</button>
        <button onclick="setTopDownViewInstant()">⚡ 2D俯视 (立即)</button>
        <button onclick="setIsometricViewInstant()">⚡ 3D斜视 (立即)</button>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
        import { CameraController, CameraPreset } from './src/render3d/camera.js';
        
        // 创建场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        
        // 创建摄像机控制器
        const aspect = window.innerWidth / window.innerHeight;
        const cameraController = new CameraController(aspect);
        const camera = cameraController.getCamera();
        
        // 创建渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        // 添加光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);
        
        // 添加网格辅助线
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);
        
        // 添加坐标轴辅助线
        const axesHelper = new THREE.AxesHelper(10);
        scene.add(axesHelper);
        
        // 添加测试立方体
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00ff88,
            metalness: 0.3,
            roughness: 0.4
        });
        const cube = new THREE.Mesh(geometry, material);
        cube.position.set(0, 1, 0);
        scene.add(cube);
        
        // 添加多个小球作为参考点
        const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const sphereMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xff6600,
            metalness: 0.5,
            roughness: 0.3
        });
        
        for (let i = 0; i < 5; i++) {
            const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            const angle = (i / 5) * Math.PI * 2;
            sphere.position.set(
                Math.cos(angle) * 5,
                0.5,
                Math.sin(angle) * 5
            );
            scene.add(sphere);
        }
        
        // 窗口大小变化处理
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            cameraController.onWindowResize(width, height);
            renderer.setSize(width, height);
        });
        
        // 更新UI显示
        function updateUI() {
            const pos = camera.position;
            document.getElementById('pos-x').textContent = pos.x.toFixed(2);
            document.getElementById('pos-y').textContent = pos.y.toFixed(2);
            document.getElementById('pos-z').textContent = pos.z.toFixed(2);
            document.getElementById('fov').textContent = camera.fov.toFixed(1);
            
            const preset = cameraController.getCurrentPreset();
            const presetText = preset === CameraPreset.TOP_DOWN_2D ? '2D俯视' : '3D斜视';
            document.getElementById('current-preset').textContent = presetText;
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新摄像机控制器
            cameraController.update();
            
            // 旋转立方体
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            
            // 更新UI
            updateUI();
            
            // 渲染场景
            renderer.render(scene, camera);
        }
        
        // 全局函数供按钮调用
        window.setTopDownView = () => {
            cameraController.setTopDownView(true);
        };
        
        window.setIsometricView = () => {
            cameraController.setIsometricView(true);
        };
        
        window.setTopDownViewInstant = () => {
            cameraController.setTopDownView(false);
        };
        
        window.setIsometricViewInstant = () => {
            cameraController.setIsometricView(false);
        };
        
        // 启动动画
        animate();
        
        console.log('✅ CameraController 测试页面加载完成');
        console.log('📹 摄像机控制器:', cameraController);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D渲染系统测试</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: white;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #4a5568;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #2d3748;
        }
        button.active {
            background: #48bb78;
        }
        #status {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div id="controls">
        <h3>3D渲染系统测试</h3>
        <button id="toggle3D">切换到3D模式</button>
        <button id="testTransition">测试过渡动画</button>
        <div id="status">
            当前模式: <span id="modeText">2D</span><br>
            3D系统状态: <span id="systemStatus">已初始化</span>
        </div>
    </div>

    <script type="module">
        import { Game } from './src/core.js';
        
        // 创建游戏实例
        const game = new Game();
        window.game = game;
        
        // 获取DOM元素
        const toggle3DBtn = document.getElementById('toggle3D');
        const testTransitionBtn = document.getElementById('testTransition');
        const modeText = document.getElementById('modeText');
        const systemStatus = document.getElementById('systemStatus');
        
        // 更新状态显示
        function updateStatus() {
            modeText.textContent = game.is3DMode ? '3D' : '2D';
            systemStatus.textContent = game.render3d.enabled ? '运行中' : '待机';
            toggle3DBtn.textContent = game.is3DMode ? '切换到2D模式' : '切换到3D模式';
            toggle3DBtn.classList.toggle('active', game.is3DMode);
        }
        
        // 切换3D模式按钮
        toggle3DBtn.addEventListener('click', () => {
            game.is3DMode = !game.is3DMode;
            
            if (game.is3DMode) {
                game.render3d.transitionTo3D();
            } else {
                game.render3d.transitionTo2D();
            }
            
            updateStatus();
        });
        
        // 测试过渡动画按钮
        testTransitionBtn.addEventListener('click', () => {
            // 切换到战斗阶段以触发3D渲染逻辑
            if (game.phase !== 'combat') {
                game.phase = 'combat';
                console.log('切换到战斗阶段');
            }
            
            // 切换3D模式
            game.is3DMode = !game.is3DMode;
            
            if (game.is3DMode) {
                game.render3d.transitionTo3D();
            } else {
                game.render3d.transitionTo2D();
            }
            
            updateStatus();
        });
        
        // 初始状态更新
        updateStatus();
        
        // 添加键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === '3') {
                toggle3DBtn.click();
            }
        });
        
        console.log('3D渲染系统测试页面已加载');
        console.log('按键盘"3"键快速切换3D模式');
    </script>
</body>
</html>
